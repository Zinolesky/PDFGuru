name: PDFGuru CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff httpx

      - name: Lint with Ruff
        run: ruff check .

      - name: Run Backend Test Suite
        env:
          GEMINI_API_KEY: "your_gemini_api_key_here"
        run: pytest -v

  frontend-ci:
    name: Frontend Build & PWA Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Production PWA Bundle
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfguru-frontend-dist
          path: frontend/dist
          retention-days: 7

  docker-build:
    name: Build & Verify Docker Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: pdfguru-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: pdfguru-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Container Smoke Test (/api/health)
        run: |
          docker run -d --name pdfguru-backend-test -p 8000:8000 pdfguru-backend:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'; then
              echo "Backend container is healthy!"
              docker rm -f pdfguru-backend-test
              exit 0
            fi
            sleep 2
          done
          docker logs pdfguru-backend-test
          docker rm -f pdfguru-backend-test
          exit 1
